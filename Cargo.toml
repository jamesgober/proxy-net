# =============================================================================
#  R E P S   ·   proxy-net
# =============================================================================
[package]
name    = "proxy-net"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Reverse proxy for Rust services on serve-net: upstream pools, health checks, load balancing, header rewriting, and forwarding with the connection gate and limits in place."

# Keywords (5 max)
keywords = ["proxy", "reverse-proxy", "load-balancer", "http", "gateway"]

# Categories
categories = ["network-programming", "web-programming"]

# Links
homepage      = "https://github.com/jamesgober/proxy-net"
repository    = "https://github.com/jamesgober/proxy-net"
documentation = "https://docs.rs/proxy-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "proxy_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None yet. Planned dependencies and the reason for each are listed in
# dev/PLAN.md; each is added with the first code that needs it.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
