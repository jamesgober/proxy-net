# =============================================================================
#  R E P S   ·   proxy-net
# =============================================================================
[package]
name    = "proxy-net"
version = "0.4.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Reverse proxy and load balancer for services on serve-net: upstream pools, health checks, balancing policies, re-serialized forwarding, and forwarding headers rebuilt from the real client."

# Keywords (5 max)
keywords = ["proxy", "reverse-proxy", "load-balancer", "http", "gateway"]

# Categories
categories = ["network-programming", "web-programming"]

# Links
repository    = "https://github.com/jamesgober/proxy-net"
documentation = "https://docs.rs/proxy-net"

# Not shipped in the package
exclude = ["fuzz/", "dev/", ".github/"]

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "proxy_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["serve"]
# Integration with the standard library. Without it the crate needs only
# `alloc` (the configuration types and the sans-IO core).
std = []
# The upstream side over net-io: connections, the connection pool, the
# health checker, and the blocking forwarder.
client = ["std", "dep:net-io", "dep:http-net"]
# The inbound side: the serve-net service and `proxy_net::proxy`.
serve = ["client", "dep:serve-net"]


# DEPENDENCIES
# #################################
[dependencies]
# Field grammar: list parsing (Connection, Via) and Forwarded writing. 0.7
# is the version http-net 0.10 pins, so the two agree when http-net joins.
parse-net = { version = "0.7", default-features = false, features = ["alloc"] }
# The upstream HTTP/1.1 client (`ClientConn`), sans-IO.
http-net = { version = "0.10", default-features = false, optional = true }
# Outbound TCP connections, deadlines, and the PROXY encoders.
net-io = { version = "0.8.1", default-features = false, features = ["proxy"], optional = true }
# The inbound engine.
serve-net = { version = "0.8.2", default-features = false, features = ["http1"], optional = true }


# Model-checking the lock-free core (tests/loom.rs); only with
# RUSTFLAGS="--cfg proxy_net_loom", never in a normal build.
[target.'cfg(proxy_net_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(proxy_net_loom)"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
proptest = "1"


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
