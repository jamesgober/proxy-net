# HAProxy in front of the bench origin (127.0.0.1:9000), on 127.0.0.1:8082.
global
    maxconn 10000

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    http-reuse always

frontend bench
    bind 127.0.0.1:8082
    default_backend origin

backend origin
    server origin 127.0.0.1:9000
