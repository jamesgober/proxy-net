# nginx in front of the bench origin (127.0.0.1:9000), on 127.0.0.1:8081.
# Run as: nginx -p /tmp/nginx-bench -e /tmp/nginx-bench/error.log -c <this file>
worker_processes auto;
daemon off;
pid /tmp/nginx-bench/nginx.pid;
error_log /tmp/nginx-bench/error.log warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-bench/body;
    proxy_temp_path /tmp/nginx-bench/proxy;
    fastcgi_temp_path /tmp/nginx-bench/fastcgi;
    uwsgi_temp_path /tmp/nginx-bench/uwsgi;
    scgi_temp_path /tmp/nginx-bench/scgi;

    upstream origin {
        server 127.0.0.1:9000;
        keepalive 256;
    }

    server {
        listen 127.0.0.1:8081;
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
